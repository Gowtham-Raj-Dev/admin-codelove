<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <title>CodeLove Admin</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%235b5bd6'/%3E%3Cpath d='M8 22V14M14 22V9M20 22v-6M26 22V11' stroke='white' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
  <script>try { var t = localStorage.getItem('cl_theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="style.css?v=20261127a">
</head>
<body>
  <div class="shell">
    <aside class="side" id="side" aria-label="Main menu">
      <div class="side-head">
        <a class="brand" href="#/reports"><span class="logo" aria-hidden="true"></span><span>CodeLove <b>Admin</b></span></a>
        <button class="icon-btn side-close" id="sideClose" aria-label="Close menu"></button>
      </div>
      <div class="side-filters" role="group" aria-label="Filters">
        <button type="button" class="dd" id="rangeBtn" aria-haspopup="listbox" aria-expanded="false" aria-label="Date range"></button>
        <div class="sf-row">
          <button type="button" class="dd" id="siteBtn" aria-haspopup="listbox" aria-expanded="false" aria-label="Site"></button>
          <button type="button" class="icon-btn" id="refresh" title="Reload data" aria-label="Reload data"></button>
        </div>
      </div>
      <nav class="nav" id="nav"></nav>
    </aside>
    <div class="scrim" id="scrim"></div>

    <div class="main">
      <!-- top bar: live count + account on the right; on phones also the menu button and brand (the sidebar is a drawer there) -->
      <header class="mtop">
        <button class="icon-btn menu-btn" id="menuBtn" aria-label="Open menu"></button>
        <a class="top-brand" href="#/reports" aria-label="CodeLove Admin home"><span class="logo" aria-hidden="true"></span><span>CodeLove <b>Admin</b></span></a>
        <div class="top-right">
          <a href="#/live" class="live-pill" id="liveBadge" hidden></a>
          <button type="button" class="acct-btn" id="accountBtn" aria-haspopup="menu" aria-expanded="false" aria-label="Account and settings"></button>
        </div>
      </header>

      <div id="downAlert" hidden></div>
      <main id="app"><div class="loading"><span class="spinner"></span>Loading…</div></main>
    </div>
  </div>

  <div id="tooltip" class="tooltip" role="status" hidden></div>

  <script src="config.js?v=20261127a"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="common.js?v=20261127a"></script>
  <script src="ga.js?v=20261127a"></script>
  <script src="gsc.js?v=20261127a"></script>
  <script src="own.js?v=20261127a"></script>
  <script src="report.js?v=20261127a"></script>
  <script src="dash.js?v=20261127a"></script>
  <script src="ads.js?v=20261127a"></script>
  <script src="tools.js?v=20261127a"></script>
  <script src="tools2.js?v=20261127a"></script>
  <script src="app.js?v=20261127a"></script>
</body>
</html>
