<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <title>CodeLove Admin</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232a78d6'/%3E%3Cpath d='M8 22V14M14 22V9M20 22v-6M26 22V11' stroke='white' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/"><span class="logo" aria-hidden="true"></span>CodeLove <span>Admin</span></a>
    <nav class="source" id="source" aria-label="Data source">
      <a href="#/" data-src="own">CodeLove Analytics</a>
      <a href="#/ga" data-src="ga">Google Analytics</a>
    </nav>
    <div class="controls">
      <a href="#/live" class="live-badge" id="liveBadge" hidden></a>
      <select id="range" aria-label="Date range">
        <option value="today">Today</option>
        <option value="yesterday">Yesterday</option>
        <option value="7">Last 7 days</option>
        <option value="28" selected>Last 28 days</option>
        <option value="90">Last 90 days</option>
        <option value="365">Last 365 days</option>
        <option value="custom">Custom…</option>
      </select>
      <span id="customRange" hidden>
        <input type="date" id="from" aria-label="From"> – <input type="date" id="to" aria-label="To">
      </span>
      <button id="refresh" class="ghost" title="Reload data">Refresh</button>
      <button id="signout" class="ghost" hidden>Sign out</button>
    </div>
    <nav class="tabs" id="tabs"></nav>
  </header>

  <main id="app"><div class="center muted">Loading…</div></main>

  <div id="tooltip" class="tooltip" hidden></div>

  <script src="config.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="common.js"></script>
  <script src="ga.js"></script>
  <script src="own.js"></script>
  <script src="app.js"></script>
</body>
</html>
